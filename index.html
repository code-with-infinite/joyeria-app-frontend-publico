  <body>
    <script>
      // Bloquear atajos comunes de inspección y consola en producción
      document.addEventListener("keydown", function (e) {
        if (
          e.key === "F12" ||
          (e.ctrlKey &&
            e.shiftKey &&
            (e.key === "I" || e.key === "J" || e.key === "C")) ||
          (e.ctrlKey && e.key === "U")
        ) {
          e.preventDefault();
          return false;
        }
      });

      // Desactivar clic derecho en producción si se desea
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault(),
      );
    </script>
    <div id="root"></div>
  </body>
